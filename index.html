<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página en ngrok (Puerto 2828)</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fb; color: #1a1a1a; margin: 0; padding: 40px; }
    .container { max-width: 720px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 14px; box-shadow: 0 18px 50px rgba(0,0,0,0.08);}    
    h1 { color: #1752f0; }
    p { line-height: 1.75; }
    .port { font-weight: bold; color: #0a6d30; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bienvenido a la página de ngrok</h1>
    <p>Esta página se sirve localmente en el puerto <span class="port">2828</span>.</p>
    <p>Para exponerla públicamente con ngrok, inicia el servidor y luego ejecuta <code>ngrok http 2828</code>.</p>
    <p>Después, ngrok te dará una URL pública que puedes compartir.</p>
  </div>
</body>
</html>
